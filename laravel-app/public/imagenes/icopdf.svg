<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 300" width="100%" height="100%">
  <!-- Background Card with fine border -->
  <rect width="240" height="300" rx="16" fill="#FFFFFF" stroke="#F1F1EF" stroke-width="2" />
  
  <!-- Modern gradient definitions -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF9F6" />
      <stop offset="100%" stop-color="#F4F3EF" />
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7B1A4A" />
      <stop offset="100%" stop-color="#500326" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.04" />
    </filter>
  </defs>

  <!-- Inner background -->
  <rect x="10" y="10" width="220" height="280" rx="12" fill="url(#bgGrad)" />

  <!-- Document Shape -->
  <g transform="translate(45, 45)" filter="url(#cardShadow)">
    <!-- Document Base Sheet -->
    <path d="M10,0 L105,0 L140,35 L140,175 C140,180.5 135.5,185 130,185 L10,185 C4.5,185 0,180.5 0,175 L0,10 C0,4.5 4.5,0 10,0 Z" fill="#FFFFFF" stroke="#E5E4E0" stroke-width="1.5" />
    <!-- Folded Corner -->
    <path d="M105,0 L105,25 C105,30.5 109.5,35 115,35 L140,35 Z" fill="#F4F3EF" stroke="#E5E4E0" stroke-width="1.5" />
    
    <!-- PDF Badge (Burgundy / Red Accent matching INIFAP theme) -->
    <rect x="20" y="65" width="100" height="42" rx="6" fill="url(#badgeGrad)" />
    <!-- PDF Text -->
    <text x="70" y="92" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" letter-spacing="1.5">PDF</text>
    
    <!-- Decorative lines for 'document' look -->
    <line x1="25" y1="135" x2="115" y2="135" stroke="#E5E4E0" stroke-width="3.5" stroke-linecap="round" />
    <line x1="25" y1="150" x2="85" y2="150" stroke="#E5E4E0" stroke-width="3.5" stroke-linecap="round" />
  </g>
</svg>
